<script>
try {
  const cv = document.getElementById("c");
  const g = cv.getContext("2d");
  let W = 360, H = 640;
  function resize() {
    W = cv.width = document.documentElement.clientWidth || 360;
    H = cv.height = document.documentElement.clientHeight || 640;
  }
  resize();
  new ResizeObserver(resize).observe(document.documentElement);

  // =====================================================================
  //  SETTINGS YOU CAN EDIT
  // =====================================================================
  // 1) THANK-YOU FENCE: these names are painted on advert boards along the school fence.
  //    To ADD a person: add a new line like  "Their Name",  (keep the quotes and the comma).
  //    To REMOVE a person: delete their line.  To CHANGE a name: edit the text between the quotes.
  //    The fence has room for 46 names (back fence first, then right, left and front).
  const THANKS = [
    "",
    "THANKS TO:",
    "YOU 😜",
    "NAIJA HIGH",
    "IS MY",
    "FAVOURITE",
    "SCHOOL.",
  ];
  // 2) WHEN A VEHICLE KILLS YOU: the share of your money you lose before the game restarts.
  //    0 = keep all your money, 0.5 = lose half, 1 = lose everything.
  const DEATH_MONEY_LOSS = 0.5;
  // =====================================================================

  // ---------- 1. VECTOR HELPERS ----------
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };
  const rotX = (v, a) => {
    const c = Math.cos(a), s = Math.sin(a);
    return [v[0], v[1] * c - v[2] * s, v[1] * s + v[2] * c];
  };
  const orient = (v, b) => rotY(b.rx ? rotX(v, b.rx) : v, b.r); // a box's own turn: tilt first, then spin
  const rotY = (v, a) => {
    const c = Math.cos(a), s = Math.sin(a);
    return [v[0] * c + v[2] * s, v[1], -v[0] * s + v[2] * c];
  };

  // ---------- 2. GROUND: tile (i, j) covers x from i to i+1 and z from j to j+1 ----------
  const SAND = [214, 196, 150];
  function tileColor(i, j) {
    if ((i === -1 || i === 0) && j >= -4 && j <= 14) return SAND;         // path from classroom to street
    if (j === 20) return [190, 185, 170];                                  // pavement on the far side of the road
    if (j >= 15 && j <= 19) return (j === 15 || j === 19) ? [145, 130, 105] : [76, 78, 82]; // street and shoulders
    if (i >= 3 && i <= 9 && j >= 1 && j <= 8)                             // football field stripes
      return i % 2 === 0 ? [102, 187, 106] : [88, 170, 92];
    return (i + j) % 2 === 0 ? [76, 175, 80] : [67, 160, 71];             // normal grass checker
  }
  const tiles = [];
  for (let i = -16; i < 16; i++)
    for (let j = -12; j < 31; j++)
      tiles.push({ i: i, j: j, c: tileColor(i, j) });

  // ---------- 3. SOLID OBJECTS ----------
  // box(x, y, z, hx, hy, hz, color): y is measured UP from the top of the ground
  const solids = [];
  function box(x, y, z, hx, hy, hz, c) {
    solids.push({ p: [x, 0.5 + y, z], h: [hx, hy, hz], r: 0, c: c });
  }
  const WALLS = []; // flat rectangles the student cannot enter

  // classroom block: walls, roof, door, four windows
  box(0, 1.5, -6, 5, 1.5, 2, [245, 235, 200]);
  box(0, 3.15, -6, 5.3, 0.15, 2.3, [150, 50, 40]);
  box(0, 0.8, -3.97, 0.5, 0.8, 0.03, [90, 55, 30]);
  for (const wx of [-3.8, -2.2, 2.2, 3.8]) box(wx, 1.8, -3.97, 0.45, 0.4, 0.03, [150, 200, 235]);
  WALLS.push({ x0: -5, x1: 5, z0: -8, z1: -4 });

  // fence: segments 2 wide, around the edge, with a gap for the gate
  for (let k = -11; k <= 11; k += 2) {
    const c = ((k + 11) / 2) % 2 === 0 ? [235, 235, 225] : [150, 190, 230];
    box(k, 0.6, -11.5, 1, 0.6, 0.15, c);                      // back fence
    if (k !== -1 && k !== 1) box(k, 0.6, 11.5, 1, 0.6, 0.15, c); // front fence, gate gap at -1 and 1
    box(-11.5, 0.6, k, 0.15, 0.6, 1, c);                      // left fence
    box(11.5, 0.6, k, 0.15, 0.6, 1, c);                       // right fence
    WALLS.push({ x0: k - 1, x1: k + 1, z0: -11.65, z1: -11.35 });                        // back fence is solid
    if (k !== -1 && k !== 1) WALLS.push({ x0: k - 1, x1: k + 1, z0: 11.35, z1: 11.65 }); // front fence is solid, gate gap stays open
    WALLS.push({ x0: -11.65, x1: -11.35, z0: k - 1, z1: k + 1 });                        // left fence is solid
    WALLS.push({ x0: 11.35, x1: 11.65, z0: k - 1, z1: k + 1 });                          // right fence is solid
  }
  box(-2.3, 0.9, 11.5, 0.3, 0.9, 0.3, [60, 110, 190]);        // gate pillars
  box(2.3, 0.9, 11.5, 0.3, 0.9, 0.3, [60, 110, 190]);

  // ---------- THANK-YOU FENCE: advert boards on the inside of the school fence, one per name in THANKS ----------
  const SIGNS = [];
  (function buildThanksFence() {
    const slots = [];
    for (let k = -11; k <= 11; k += 2) slots.push({ x: k, z: -11.33, N: [0, 0, 1], A: [1, 0, 0] });              // back fence
    for (let k = -11; k <= 11; k += 2) slots.push({ x: 11.33, z: k, N: [-1, 0, 0], A: [0, 0, 1] });             // right fence
    for (let k = -11; k <= 11; k += 2) slots.push({ x: -11.33, z: k, N: [1, 0, 0], A: [0, 0, -1] });            // left fence
    for (let k = -11; k <= 11; k += 2) if (k !== -1 && k !== 1) slots.push({ x: k, z: 11.33, N: [0, 0, -1], A: [-1, 0, 0] }); // front fence (gate gap skipped)
    const BOARD = [[40, 110, 200], [230, 170, 30], [200, 60, 50], [40, 150, 90], [130, 70, 170]];
    const INK = ["#ffffff", "#102030", "#ffffff", "#ffffff", "#ffffff"];
    for (let i = 0; i < THANKS.length && i < slots.length; i++) {
      const s = slots[i], c = i % BOARD.length;
      const alongX = s.A[0] !== 0;
      box(s.x, 0.62, s.z, alongX ? 0.9 : 0.02, 0.34, alongX ? 0.02 : 0.9, BOARD[c]);
      SIGNS.push({ sign: true, p: [s.x + s.N[0] * 0.08, 0.5 + 0.62, s.z + s.N[2] * 0.08], N: s.N, A: s.A, text: String(THANKS[i]), ink: INK[c], h: [0, 0, 0], c: [0, 0, 0] });
    }
  })();

  // trees: trunk plus two leaf blocks
  function tree(x, z) {
    box(x, 0.8, z, 0.2, 0.8, 0.2, [110, 75, 40]);
    box(x, 2.2, z, 0.8, 0.6, 0.8, [34, 120, 50]);
    box(x, 3.2, z, 0.5, 0.4, 0.5, [40, 140, 60]);
    WALLS.push({ x0: x - 0.2, x1: x + 0.2, z0: z - 0.2, z1: z + 0.2 });
  }
  tree(-8, -1);
  tree(-8, 5);
  tree(-6, 8);
  tree(8.5, -9);

  // playground swing set: sturdy frame plus a seat that moves back and forth
  const SWING = { x: -5.5, z: -2.0, angle: 0 };
  const SWING_FRAME = [
    { x: SWING.x - 1.15, y: 1.55, z: SWING.z, hx: 0.10, hy: 1.55, hz: 0.10, c: [70, 85, 100] },
    { x: SWING.x + 1.15, y: 1.55, z: SWING.z, hx: 0.10, hy: 1.55, hz: 0.10, c: [70, 85, 100] },
    { x: SWING.x, y: 3.05, z: SWING.z, hx: 1.35, hy: 0.12, hz: 0.12, c: [55, 70, 85] }
  ];
  for (const a of SWING_FRAME) box(a.x, a.y, a.z, a.hx, a.hy, a.hz, a.c);
  const swingChains = [];
  for (const dx of [-0.32, 0.32]) {
    // Each chain is positioned halfway between its fixed top pivot and the moving seat.
    const chain = { p: [SWING.x + dx, 2.305, SWING.z], h: [0.025, 0.625, 0.025], r: 0, c: [90, 90, 95], rx: 0 };
    swingChains.push(chain); solids.push(chain);
  }
  const SWING_PIVOT_Y = 2.93;
  const SWING_LENGTH = 1.25;
  const swingSeat = { p: [SWING.x, SWING_PIVOT_Y - SWING_LENGTH, SWING.z], h: [0.42, 0.08, 0.22], r: 0, c: [210, 65, 45], rx: 0 };
  solids.push(swingSeat);
  WALLS.push({ x0: SWING.x - 1.3, x1: SWING.x - 1.0, z0: SWING.z - 0.2, z1: SWING.z + 0.2 });
  WALLS.push({ x0: SWING.x + 1.0, x1: SWING.x + 1.3, z0: SWING.z - 0.2, z1: SWING.z + 0.2 });

  // buka (food stall): counter, back wall, four posts, roof, sign, food on the counter
  box(8.5, 0.55, -3.2, 1.6, 0.55, 0.35, [150, 100, 55]);
  box(8.5, 1.0, -5.25, 1.8, 1.0, 0.08, [245, 235, 200]);
  for (const px of [6.8, 10.2]) for (const pz of [-2.9, -5.1]) box(px, 1.0, pz, 0.08, 1.0, 0.08, [110, 75, 40]);
  box(8.5, 2.15, -4, 1.9, 0.12, 1.3, [200, 50, 40]);
  box(8.5, 2.5, -2.72, 1.2, 0.2, 0.04, [255, 214, 64]);
  box(7.6, 1.3, -3.2, 0.22, 0.2, 0.22, [60, 60, 70]);
  box(8.6, 1.2, -3.2, 0.3, 0.1, 0.2, [240, 240, 235]);
  box(9.5, 1.25, -3.2, 0.2, 0.15, 0.2, [220, 150, 50]);
  WALLS.push({ x0: 6.9, x1: 10.1, z0: -3.55, z1: -2.85 });
  WALLS.push({ x0: 6.7, x1: 10.3, z0: -5.35, z1: -5.15 });

  // ---------- VEHICLES: little box models, like characters. Forward is +z. ----------
  const TYRE = [30, 30, 32], GLASS = [140, 190, 225], DARK = [40, 40, 44];
  const wheel = (x, z, r) => [x, r, z, 0.09, r, r, TYRE];
  const person = (x, y, z, shirt, skin, cap) => {            // a seated driver or passenger: body, head, optional cap
    const p = [[x, y, z, 0.2, 0.28, 0.12, shirt], [x, y + 0.48, z + 0.02, 0.15, 0.15, 0.15, skin]];
    if (cap) p.push([x, y + 0.66, z + 0.02, 0.16, 0.04, 0.16, cap]);
    return p;
  };
  const VEH = {
    okada: { len: 0.95, wid: 0.45, speed: 7, build: (c, s) => [
      wheel(0, 0.75, 0.3), wheel(0, -0.75, 0.3), [0, 0.55, 0, 0.14, 0.12, 0.8, c], [0, 0.8, 0.25, 0.18, 0.12, 0.25, c],
      [0, 0.78, -0.35, 0.17, 0.05, 0.4, DARK], [0, 1.05, 0.6, 0.38, 0.04, 0.05, [70, 70, 75]], [0, 0.85, 0.9, 0.08, 0.08, 0.04, [255, 240, 160]]
    ].concat(person(0, 1.25, 0.1, s.shirt, s.skin, s.cap), s.pax ? person(0, 1.25, -0.5, s.pax, s.skin2, null) : []) },
    keke: { len: 1.1, wid: 0.7, speed: 4.5, build: (c, s) => [
      wheel(0, 1.05, 0.3), wheel(-0.55, -0.7, 0.3), wheel(0.55, -0.7, 0.3), [0, 0.7, -0.2, 0.6, 0.28, 0.95, c], [0, 0.98, -0.2, 0.62, 0.04, 0.97, DARK],
      [0, 0.65, 0.95, 0.3, 0.25, 0.2, c], [0, 2.2, -0.3, 0.66, 0.05, 0.9, [40, 110, 60]],
      [-0.58, 1.45, 0.45, 0.04, 0.75, 0.04, DARK], [0.58, 1.45, 0.45, 0.04, 0.75, 0.04, DARK], [-0.6, 1.45, -1.1, 0.04, 0.75, 0.04, DARK], [0.6, 1.45, -1.1, 0.04, 0.75, 0.04, DARK]
    ].concat(person(0, 1.3, 0.4, s.shirt, s.skin, null), s.pax ? person(0, 1.3, -0.6, s.pax, s.skin2, null) : []) },
    car: { len: 1.6, wid: 0.8, speed: 6, build: (c) => [
      wheel(-0.65, 1.0, 0.3), wheel(0.65, 1.0, 0.3), wheel(-0.65, -1.0, 0.3), wheel(0.65, -1.0, 0.3),
      [0, 0.65, 0, 0.7, 0.3, 1.55, c], [0, 1.12, -0.15, 0.6, 0.25, 0.85, c.map((v) => Math.round(v * 0.8))], [0, 1.15, -0.15, 0.61, 0.15, 0.75, GLASS]
    ] },

    ch.face = Math.atan2(dx, dz);
    return moved;

    trafficTimer -= dt;

    const walkers = npcs.filter((n) => !n.inside && !n.inRoom && n.kind !== "vendor");
    if (scene === "outside") walkers.push(pl);
    for (const v of traffic) {
      let personBrake = false, carBrake = false, warn = false;
      for (const w of walkers) {                                    // look for anyone in the lane ahead
        const ahead = (w.x - v.x) * v.dir;
        if (ahead > 0 && Math.abs(w.z - v.z) < 1.0) {
          if (ahead < v.len + 2.0) personBrake = true;              // close: a careful driver brakes
          if (ahead < v.len + 8) warn = true;                       // not so close: every driver honks
        }
      }
      for (const u of traffic) {                                    // do not drive through the vehicle in front
        if (u === v || u.lane !== v.lane) continue;
        const gap = (u.x - v.x) * v.dir;
        if (gap > 0 && gap < v.len + u.len + 0.8) carBrake = true;
      }
      let stop = carBrake || (personBrake && !v.reckless);          // reckless drivers never brake for people
      if (v.parent) {                                               // the parent's car stops in front of the gate and waits
        if (v.x <= v.stopX + 0.9) { stop = true; v.parked = v.cur < 0.4; }
        v.cryCd -= dt;
        if (v.cryCd <= 0 && scene === "outside") { say(v, v.parked ? pickOne(["Oya come! I don reach o!", "Hurry, the traffic is mad!", "My pikin, enter the car!"]) : "I dey come, I dey come!", 2.6); v.cryCd = 5; }
      }
      v.cur += ((stop ? 0 : v.speed) - v.cur) * Math.min(1, dt * 5);
      v.x += v.dir * v.cur * dt;
      v.honkCd -= dt; v.shoutCd -= dt;
      const near = scene === "outside" && Math.abs(v.x - pl.x) < 10;
      if (warn && v.honkCd <= 0 && near) { say(v, v.reckless ? "⚠️ Pin pin pin!!" : pickOne(["Pin pin!", "Oga look road!", "Wetin dey do you?!", "Comot for road!", "Ah-ah! Chai!"]), 2); v.honkCd = 4; }
      if (v.type === "danfo" && v.shoutCd <= 0 && near) { say(v, pickOne(["Ojuelegba! Ojuelegba!", "Oshodi! Oya enter!", "Yaba, Yaba, Yaba!"]), 2.4); v.shoutCd = rand(6, 10); }
      // a moving vehicle that touches you kills you (a stopped one cannot)
      if (!dead && scene === "outside" && !dialogue && !trip && v.cur > 1.5 && Math.abs(pl.x - v.x) < v.len + 0.25 && Math.abs(pl.z - v.z) < v.wid + 0.25) killPlayer(v);
    }
    for (let i = traffic.length - 1; i >= 0; i--) if (Math.abs(traffic[i].x) > 18) traffic.splice(i, 1);
  }
  let roadWarned = false;
  function updateRoadWarning() {                                 // a warning as you step out of the school gate
    if (scene !== "outside") return;
    if (pl.z > 12.2 && !roadWarned) { roadWarned = true; flashHint("⚠️ You won enter road now ooo, shine your eye well well", 4500); }
    if (pl.z < 10.5) roadWarned = false;
  }
  function addVehicle(list, v) {
    for (const q of v.parts) {
      const w = rotY([q[0], q[1], q[2]], v.face);
      list.push({ p: [v.x + w[0], 0.5 + w[1], v.z + w[2]], h: [q[3], q[4], q[5]], c: q[6], r: v.face });
    }
  }

  // called once, at the moment the plan changes (for example, the assembly bell)
  function changePlan(n, plan, onTime) {
    n.mode = plan;
    n.seated = false; n.inRoom = false; n.armR = null;     // whoever walks out of class stands up properly (legs visible!)
    if (plan === "class" && (n.patrol || Math.random() < n.skipChance)) n.mode = "wander";
    n.lateT = 0;
    // A late teacher: wanders for a while, so the classroom has no teacher (dubbing time!). Not the principal, not Mr Kasala.
    if (plan === "class" && n.mode === "class" && n.kind === "teacher" && !n.info.principal && !onTime && Math.random() < 0.6) { n.mode = "wander"; n.lateT = rand(22, 38); }
    if (n.inside) {                       // come back out where we went in
      n.inside = false;
      n.x = rand(-0.5, 0.5);
      n.z = n.hideAt === "gate" ? 10.6 : -3.4;
    }
    n.giveUp = 30;
    if (n.mode === "wander") { pickTarget(n); n.wait = rand(0, 2); }
    else if (n.mode === "class") { n.tx = rand(-0.5, 0.5); n.tz = -3.4; }
    else if (n.mode === "home") { n.tx = rand(-1, 1); n.tz = 10.6; }
    else if (n.mode === "assembly") {
      if (n.kind === "student") { n.tx = 4 + (n.slot % 3) * 1.6; n.tz = 3 + Math.floor(n.slot / 3) * 1.6; }
      else if (n.info.principal) { n.tx = 5.6; n.tz = 1.5; }
      else { n.tx = 9.2; n.tz = 2.5 + n.slot * 1.6; }
    }
  }

  function updateNpc(n, dt) {
    if (n.cool > 0) n.cool -= dt;
    if (n.talking) { n.face = Math.atan2(pl.x - n.x, pl.z - n.z); animate(n, false, dt, 10); return; }
    if (n.streetRole) {
      n.workClock += dt;
      n.calloutCooldown -= dt;
      if (n.streetRole === "vulcaniser") {
        // Repeatedly pumps/works on a tyre: arm moves in short, varied strokes.
        n.armR = -0.35 + Math.sin(n.workClock * 5.2) * 0.42;
        n.face = Math.PI;
        if (n.calloutCooldown <= 0 && scene === "outside" && Math.hypot(pl.x - n.x, pl.z - n.z) < 4.4 && !dialogue) {
          say(n, "Spoilt pikin, you no fit greet elders?", 2.8);
          n.calloutCooldown = 8;
        }
      } else if (n.streetRole === "okada" || n.streetRole === "keke") {
        // Waiting for a customer: waves an arm and calls out when you come near.
        n.face = n.baseFace;
        n.armR = -0.2 + Math.sin(n.workClock * 2.4) * 0.6;
        if (n.calloutCooldown <= 0 && scene === "outside" && Math.hypot(pl.x - n.x, pl.z - n.z) < 6 && !dialogue) {
          say(n, pickOne(n.streetRole === "okada" ? ["Oga! Okada! Where you dey go?", "Boss, I fit take you go anywhere!", "Okada! Fast fast!"] : ["Keke! Keke! Enter, ma!", "Oya, Keke dey go!", "Customer! I carry you comfortable!"]), 2.6);
          n.calloutCooldown = rand(6, 9);
        }
      } else if (n.streetRole === "hawker") {
        // Walks back and forth along the school side of the street selling pure water.
        n.x += n.dir * 1.3 * dt;
        if (n.x > 4.5) n.dir = -1;
        if (n.x < -4.5) n.dir = 1;
        n.face = n.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
        if (n.calloutCooldown <= 0 && scene === "outside" && !dialogue) {
          say(n, pickOne(["Pure water! Cold-cold ₦20!", "Pure water ooo!", "Sachet water! Come and buy!"]), 2.4);
          n.calloutCooldown = rand(5, 8);
        }
      } else {
        // The corn seller calls out and waves to passers-by.
        n.armR = -0.2 + Math.sin(n.workClock * 3.1) * 0.55;
        n.face = Math.PI;
        if (n.calloutCooldown <= 0 && scene === "outside" && !dialogue) {
          say(n, pickOne(["Come buy corn ooo!", "Sweet sweet corn!", "Hot roasted corn! Come and buy!", "Corn wey sweet, come buy ooo!"]), 2.4);
          n.calloutCooldown = rand(4.5, 7.0);
        }
      }
      animate(n, n.streetRole === "hawker", dt, 10);
      return;
    }
    if (n.kind === "vendor") { animate(n, false, dt, 10); return; }
    if (n.goal) {                          // a scripted order: walk there and wait
      const sx = n.goal.x - n.x, sz = n.goal.z - n.z;
      if (Math.hypot(sx, sz) < 0.2) { n.face = n.goal.face; animate(n, false, dt, 10); return; }
      const went = walk(n, sx, sz, n.speed * 1.5, dt);
      animate(n, went, dt, 10);
      return;
    }
    if (n.seated && !n.inRoom) n.seated = false;            // safety net: only people in the classroom can be seated
    const plan = PLAN[clock.period] || "wander";
    if (plan !== n.seenPlan) { n.seenPlan = plan; changePlan(n, plan); }
    if (n.inside) return;

    if (n.mode === "wander") {
      if (n.lateT > 0) { n.lateT -= dt; if (n.lateT <= 0) { n.lateT = 0; changePlan(n, "class", true); return; } }   // the late teacher finally heads to class
      if (n.wait > 0) { n.wait -= dt; animate(n, false, dt, 10); return; }
      n.giveUp -= dt;
      const dx = n.tx - n.x, dz = n.tz - n.z;
      if (Math.hypot(dx, dz) < 0.2 || n.giveUp <= 0) {
        pickTarget(n);
        n.wait = rand(1, 3);
        animate(n, false, dt, 10);
        return;
      }
      const moved = walk(n, dx, dz, n.speed, dt);
      animate(n, moved, dt, 10);
      if (!moved) pickTarget(n);
      return;
    }

    // class, home, assembly: go to the spot, then do the arrival thing
    n.giveUp -= dt;
    const gx = n.tx - n.x, gz = n.tz - n.z;
    if (Math.hypot(gx, gz) < 0.25 || n.giveUp <= 0) {
      n.x = n.tx; n.z = n.tz;
      if (n.mode === "class" || n.mode === "home") {
        n.inside = true;
        n.hideAt = n.mode === "home" ? "gate" : "door";
      } else {
        if (n.lookAt) n.face = Math.atan2(n.lookAt.x - n.x, n.lookAt.z - n.z);
        else n.face = n.info.principal ? 0 : n.kind === "student" ? Math.PI : -Math.PI / 2;
      }
      animate(n, false, dt, 10);
      return;
    }
    const moved2 = walk(n, gx, gz, n.speed, dt);
    animate(n, moved2, dt, 10);
  }

  // ---------- 8. SCHOOL CLOCK ----------
  // times are "minutes since midnight": 450 = 7:30 AM, 780 = 1:00 PM
  const SCHEDULE = [
    { at: 450, name: "Arrival" },
    { at: 480, name: "Assembly" },
    { at: 540, name: "Class 1" },
    { at: 600, name: "Class 2" },
    { at: 660, name: "Break" },
    { at: 690, name: "Class 3" },
    { at: 750, name: "Class 4" },
    { at: 810, name: "Closing" }
  ];
  const DAY_START = 450, DAY_END = 870;
  const MINUTES_PER_SECOND = 1; // game minutes that pass per real second
  const clock = { min: DAY_START, day: 1, period: "", bell: 0 };
  const hud = document.getElementById("hud");

  function fmt(min) {
    const h = Math.floor(min / 60);
    const m = Math.floor(min % 60);
    return ((h % 12) || 12) + ":" + (m < 10 ? "0" : "") + m + (h < 12 ? " AM" : " PM");
  }

  function updateClock(dt) {
    clock.min += dt * MINUTES_PER_SECOND;
    if (clock.min >= DAY_END) { clock.min = DAY_START; clock.day += 1; }
    let name = SCHEDULE[0].name;
    for (const p of SCHEDULE) if (clock.min >= p.at) name = p.name;
    if (name !== clock.period) { clock.period = name; clock.bell = 3; }
    clock.bell = Math.max(clock.bell - dt, 0);
    const text = (clock.bell > 0 ? "🔔 " : "") + "Day " + clock.day + " · " + fmt(clock.min) + " · " + clock.period;
    if (hud.textContent !== text) hud.textContent = text;
  }

  // ---------- 9. MONEY AND TALKING ----------
  let money = 0;
  let floaters = [];
  const cashEl = document.getElementById("cash");
  try { money = Number(localStorage.getItem("naijaHighMoney")) || 0; } catch (e) { money = 0; }
  cashEl.textContent = "₦" + money;

  function addMoney(delta) {
    const before = money;
    money = Math.max(0, money + delta);
    const real = money - before;
    cashEl.textContent = "₦" + money;
    try { localStorage.setItem("naijaHighMoney", String(money)); } catch (e) { /* saving is optional */ }
    if (real !== 0) {
      floaters.push({ text: (real > 0 ? "+" : "-") + "₦" + Math.abs(real), color: real > 0 ? "120,255,140" : "255,120,120", life: 1.6 });
    }
  }

  const talkBtn = document.getElementById("talk");
  const padEl = document.getElementById("pad");
  const dlg = document.getElementById("dlg");
  const TALK_DISTANCE = 2.2;
  let dialogue = null; // the NPC we are talking to, or null
  let nearNpc = null;  // the NPC close enough to talk to, or null

  function showLine(name, text, choices) {
    document.getElementById("dname").textContent = name;
    document.getElementById("dtext").textContent = text;
    const box = document.getElementById("dchoices");
    box.textContent = "";
    for (const c of choices) {
      const b = document.createElement("button");
      b.textContent = c.text;
      b.addEventListener("click", () => pick(c));
      box.appendChild(b);
    }
  }

  function pick(c) {
    if (c.socialAction) { handleSocialChoice(c); return; }
    if (c.copyAction) { handleCopy(c); return; }
    if (c.homeAction) { handleHome(c); return; }
    if (c.dubAction) { handleDub(c); return; }
    // Crush conversations use the same NPC dialogue pattern as everyone else:
    // Zara speaks, the player chooses their own line, then Zara answers.
    if (c.crushSay) {
      showLine("YOU", c.crushSay, [{ text: "Continue", crushResponse: c }]);
      return;
    }
    if (c.crushResponse) {
      const r = c.crushResponse;
      if (crushToday.day !== clock.day) crushToday = { day: clock.day };            // new school day, fresh chances
      const confBefore = crushConfidence;
      const fresh = (k) => (crushToday[k] ? false : (crushToday[k] = true));        // true only the FIRST time today
      if (r.crushEffect === "kind" && fresh("kind")) { crushConfidence += 1; friendship++; }
      if (r.crushEffect === "funny" && fresh("funny")) { crushConfidence++; friendship++; popularity++; }
      if (r.crushEffect === "shy" && fresh("shy")) crushConfidence++;
      if (r.crushEffect === "contact" && !crushNpc.contactExchanged) { crushNpc.contactExchanged = true; friendship += 2; crushConfidence += 2; }
      if (perkIs("charming") && crushConfidence > confBefore) crushConfidence++;   // Charming: +1 whenever you win crush points
      showLine(crushNpc.label, r.crushReply, r.afterChoices || [
        { text: "Wetin you like doing after school?", crushSay: "Wetin you like doing after school?", crushReply: "I dey gist with my friends, listen to music, and sometimes read. You nko?", crushEffect: "kind" },
        ...(crushNpc.contactExchanged ? [] : [{ text: "📱 Make we exchange contacts?", crushSay: "You go mind if we exchange contacts?", crushReply: "I no mind. Make we exchange as friends.", crushEffect: "contact" }]),
        { text: "I go see you later", crushEnd: true }
      ]);
      return;
    }
    if (c.crushEnd) {
      showLine("YOU", "Alright, see you later.", [{ text: "Close conversation", closeNow: true }]);
      return;
    }
    if (c.closeNow) { closeDialogue(); return; }
    if (c.menu) { const sc = dialogue.streetRole === "hawker" ? hawkerShop() : dialogue.streetRole === "corn" ? cornShop() : SCENARIOS.shop(dialogue); showLine(dialogue.label, sc.line, sc.choices); return; }
    if (c.buy) {
      if (money >= c.buy.price) {
        addMoney(-c.buy.price);
        addEnergy(c.buy.energy);
        showLine(dialogue.label, c.buy.reply, [{ text: "Buy more", menu: true }, { text: "Leave" }]);
      } else {
        showLine(dialogue.label, "Eh, your money no reach.", [{ text: "Back", menu: true }, { text: "Leave" }]);
      }
      return;
    }
    if (c.gain) addMoney(c.gain);
    if (c.pop) popularity += c.pop;
    if (c.owe) dialogue.owes = 80;
    if (c.repay) dialogue.owes = 0;
    if (c.reply) showLine(dialogue.label, c.reply, [{ text: "OK" }]);
    else closeDialogue();
  }

  // ---------- STEP 14: PHYSICAL BREAK-TIME & SOCIAL LIFE ----------
  const socialBtn = document.getElementById("socialBtn");
  let popularity = 0, friendship = 0, crushConfidence = 0, truthDarePlayed = 0;
  const socialActor = { label: "Classmates", talking: true, cool: 0, owes: 0 };
  let truthDareRound = 0;
  let nearBall = false;
  const ball = { x: -6.2, z: 2.8, vx: 0, vz: 0, active: true };

  // Truth or Dare works outside at Break, or inside during a lesson. Never on Zara (she has her own talk).
  const socialOk = () => !!(!dialogue && !lesson && !pl.seated && nearNpc && nearNpc.kind === "student" && !nearNpc.specialCrush &&
    ((scene === "outside" && clock.period === "Break") || (scene === "class" && clock.period.startsWith("Class"))));

  // Social points: loaded on start, saved whenever they change, and shown under the energy bar.
  let crushToday = { day: -1 };
  const socialEl = document.getElementById("social");
  let socialSig = "";
  try {
    const sv = JSON.parse(localStorage.getItem("naijaHighSocial") || "{}");
    popularity = Number(sv.p) || 0; friendship = Number(sv.f) || 0; crushConfidence = Number(sv.c) || 0;
    crushNpc.contactExchanged = !!sv.k;
  } catch (e) { /* no saved social life yet */ }
  function syncSocial() {
    const sig = [friendship, popularity, crushConfidence, crushNpc.contactExchanged ? 1 : 0].join("|");
    if (sig === socialSig) return;
    socialSig = sig;
    try { localStorage.setItem("naijaHighSocial", JSON.stringify({ f: friendship, p: popularity, c: crushConfidence, k: !!crushNpc.contactExchanged })); } catch (e) { /* saving is optional */ }
    socialEl.textContent = "💗 Friends " + friendship + " · ⭐ Pop " + popularity + " · 😳 Crush " + crushConfidence;
    socialEl.style.display = friendship + popularity + crushConfidence > 0 ? "block" : "none";
  }

  function socialOpen() {
    if (!socialOk()) {
      flashHint("Walk up to a classmate (outside at break, or in class), then tap Truth or Dare.", 3000); return;
    }
    if (clock.period !== "Break" && Math.random() < 0.25) {
      flashHint("The teacher is teaching. Try again at break.", 3000); return;
    }
    dialogue = socialActor; socialActor.talking = true;
    keys.up = keys.down = keys.left = keys.right = false;
    dlg.style.display = "block"; padEl.style.display = "none"; talkBtn.style.display = "none";
    showLine("TUNDE", "Oya, truth or dare? Pick one.", [
      { text: "🤐 Truth", socialAction: "truth" },
      { text: "🔥 Dare", socialAction: "dare" },
      { text: "I pass this round", socialAction: "pass" },
      { text: "I wan comot", socialAction: "leave" }
    ]);
  }
  function handleSocialChoice(c) {
    if (c.socialAction === "leave") { closeDialogue(); return; }
    if (c.socialAction === "truth") {
      truthDarePlayed++;
      showLine("CHIDI", "Truth: who you like for this school? No lie o!", [
        { text: "I get person for mind 👀", socialAction: "truthCrush" },
        { text: "I no like anybody", socialAction: "truthNobody" },
        { text: "I no wan talk am", socialAction: "truthPass" }
      ]); return;
    }
    if (["truthCrush", "truthNobody", "truthPass"].includes(c.socialAction)) {
      if (c.socialAction === "truthCrush") {
        friendship++; popularity += 1 + (perkIs("playful") ? 1 : 0);
        showLine("FEMI", "Ehen! Who be the person? 😏", [
          { text: "I no go mention name", socialAction: "again" },
          { text: "Make una guess", socialAction: "guess" },
          { text: "Next question abeg", socialAction: "again" }
        ]); return;
      }
      showLine("AMAKA", c.socialAction === "truthNobody" ? "Hmm. We go believe you sha. Next!" : "No wahala. You no must answer everything.", [
        { text: "Next round", socialAction: "again" }, { text: "I wan comot", socialAction: "leave" }
      ]); return;
    }
    if (c.socialAction === "guess") {
      showLine("TUNDE", "Na " + crushNpc.label + " abi? 😂", [
        { text: "Una too like gist", socialAction: "again" },
        { text: "Next question abeg", socialAction: "again" }
      ]); return;
    }
    if (c.socialAction === "dare") {
      truthDarePlayed++;
      showLine("FEMI", "Your dare: do Mr Kasala voice. You fit do am?", [
        { text: "STUDENT! IS THIS A SCHOOL OR MOTOR PARK?!", socialAction: "impression" },
        { text: "I go sing school anthem instead", socialAction: "sing" },
        { text: "I no do this one", socialAction: "pass" }
      ]); return;
    }
    if (c.socialAction === "impression") {
      popularity += 2 + (perkIs("playful") ? 1 : 0); friendship++;
      showLine("CHIDI", "😂😂 Omo! You sound exactly like am!", [{text:"Another round",socialAction:"again"},{text:"I wan comot",socialAction:"leave"}]); return;
    }
    if (c.socialAction === "sing") {
      popularity += 1 + (perkIs("playful") ? 1 : 0); friendship++;
      showLine("AMAKA", "Your voice no bad o! Tunde, your turn!", [{text:"Another round",socialAction:"again"},{text:"I wan comot",socialAction:"leave"}]); return;
    }
    if (c.socialAction === "pass") {
      showLine("AMAKA", "No wahala. Nobody must do wetin dem no want.", [{text:"Next round",socialAction:"again"},{text:"I wan comot",socialAction:"leave"}]); return;
    }
    if (c.socialAction === "again") { showLine("TUNDE", "Oya, next round. Truth or dare?", [{text:"Truth",socialAction:"truth"},{text:"Dare",socialAction:"dare"},{text:"I wan comot",socialAction:"leave"}]); return; }
  }
  socialBtn.addEventListener("click", socialOpen);

  // ---------- ASSIGNMENT COPYING (once per school day) ----------
  // A classmate offers their assignment. You can copy it (watch the teacher!), do it yourself, or walk away.
  let assignmentDay = -1;                      // the school day the assignment chance was last used
  let copying = null;                          // { mate, teacher, face0, progress, round, watching }
  const COPY_GOAL = 3, COPY_ROUNDS = 4;
  const CATCH = { fast: [0.1, 0.7], careful: [0, 0.2] };   // chance of being caught: [teacher at the board, teacher looking]
  const assignmentReady = () => scene === "class" && assignmentDay !== clock.day && npcs.some((n) => n.inRoom && n.kind === "teacher");
  function copyOffer() {
    return { line: "Psst... the assignment is due today o! You do am?", choices: [
      { text: "😬 No o. Abeg, make I copy yours", copyAction: "start" },
      { text: "📖 I go do am myself", copyAction: "own" },
      { text: "Not my business", reply: "Okay o. Na your matter." }
    ] };
  }
  function copyEnd(result) {
    const t = copying.teacher, mate = copying.mate;
    t.face = copying.face0;                    // the teacher turns back
    assignmentDay = clock.day;                 // today's chance is used up, whatever happened
    copying = null;
    if (result === "done") {
      addMoney(25);
      showLine(mate.label, "Haha, you finish am! Try to understand am too o, exam no dey copy. (+₦25)", [{ text: "OK", closeNow: true }]);
    } else if (result === "caught") {
      say(t, "STUDENT! You are copying?!", 3);
      addMoney(-60); popularity = Math.max(0, popularity - 1); friendship = Math.max(0, friendship - 1);
      showLine(t.label, "Copying is cheating. ₦60 fine, and your mates lose respect for you. Do your own work next time.", [{ text: "Sorry, " + (t.label.startsWith("Mr ") ? "sir" : "ma"), closeNow: true }]);
    } else if (result === "bell") {
      showLine(mate.label, "The teacher left. The assignment chance is gone for today.", [{ text: "OK", closeNow: true }]);
    } else {
      showLine(t.label, "Time up. You no finish, so no marks today.", [{ text: "OK", closeNow: true }]);
    }
  }
  function copyRound() {
    const c = copying;
    if (!c.teacher.inRoom || scene !== "class") { copyEnd("bell"); return; }
    c.round++;
    if (c.round > COPY_ROUNDS) { copyEnd("late"); return; }
    c.watching = Math.random() < 0.45;
    c.teacher.face = c.watching ? Math.atan2(pl.x - c.teacher.x, pl.z - c.teacher.z) : c.face0;
    say(c.teacher, c.watching ? "Eyes on your books!" : "(writing on the board)", 2);
    showLine("ASSIGNMENT · Round " + c.round + "/" + COPY_ROUNDS + " · Copied " + c.progress + "/" + COPY_GOAL,
      c.watching ? "👀 " + c.teacher.label + " is looking at the class!" : "✍️ " + c.teacher.label + " is facing the board.", [
      { text: "✍️ Copy fast (+2)", copyAction: "fast" },
      { text: "🤏 Copy small small (+1)", copyAction: "careful" },
      { text: "⏳ Wait one round", copyAction: "wait" }
    ]);
  }
  function handleCopy(c) {
    const a = c.copyAction;
    if (a === "start") {
      copying = { mate: dialogue, teacher: npcs.find((n) => n.inRoom && n.kind === "teacher"), progress: 0, round: 0, watching: false };
      copying.face0 = copying.teacher.face;
      copyRound(); return;
    }
    if (a === "fast" || a === "careful" || a === "wait") {
      if (!copying.teacher.inRoom) { copyEnd("bell"); return; }
      if (a !== "wait") {
        if (Math.random() < Math.min(0.95, CATCH[a][copying.watching ? 1 : 0] * levelOf().catchMul)) { copyEnd("caught"); return; }
        copying.progress += a === "fast" ? 2 : 1;
        if (copying.progress >= COPY_GOAL) { copyEnd("done"); return; }
      }
      copyRound(); return;
    }
    if (a === "own") {
      const t = npcs.find((n) => n.inRoom && n.kind === "teacher");
      if (!t || !SUBJECT_QUIZ[t.label]) { showLine(dialogue.label, "Ah, the teacher is not in. Try again later.", [{ text: "OK", closeNow: true }]); return; }
      const sc = SCENARIOS[pickOne(SUBJECT_QUIZ[t.label])]();
      copying = { teacher: t, mate: dialogue, face0: t.face };
      showLine("YOUR ASSIGNMENT · " + t.label, sc.line, sc.choices.map((ch) => ({ text: ch.text, copyAction: "ownAnswer", ok: !!ch.gain })));
      return;
    }
    if (a === "ownAnswer") {
      const t = copying.teacher; copying = null;
      assignmentDay = clock.day;
      if (c.ok) { addMoney(60); friendship++; showLine(t.label, "Excellent! Honest work pays. (+₦60)", [{ text: "OK", closeNow: true }]); }
      else { addMoney(10); showLine(t.label, "Not correct, but you tried. Honest effort counts. (+₦10)", [{ text: "OK", closeNow: true }]); }
    }
  }

  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = list[i]; list[i] = list[j]; list[j] = tmp;
    }
    return list;
  }

    };

      if (n.cool > 0) return { line: pickOne(["We just talked o. Let me breathe small!", "Ah-ah, you again? Give me small time."]), choices: [{ text: "OK" }] };

      return {

      return { line: pickOne(["Eh, we just spoke. Go and do something.", "Again? Let me breathe small.", "I have said my own. Go on."]), choices: [{ text: "OK" }] };
    }
    if (n.owes > 0) {

    if (n.inRoom) {                         // sitting in the classroom with you

      return { line: pickOne(["Shhh! The teacher is looking.", "Not now, I'm taking notes!", "Psst... did you do the assignment?"]), choices: [{ text: "OK" }] };
    }

      return { line: n.kind === "student" ? "Sorry o, I'm late for class!" : "I am on my way to class. Move along.", choices: [{ text: "OK" }] };
    }
    if (inClass && n.kind === "student") {
      return { line: "Shhh! Don't tell Mr Kasala I'm outside o. I go give you ₦100.", choices: [
        { text: "Take ₦100", gain: 100, reply: "We dey together!" },

        { text: kasalaBribe ? "sir keep shut make I bribe you (-₦40)" : "Sorry, " + sir + " (-₦50)", gain: kasalaBribe ? -40 : -50, reply: kasalaBribe ? pickOne(["You wan bribe me? Oya, make I see the money.", "You think say I no get price? Pay and disappear!"]) : pickOne(["Hmm. Don't let me meet you here again.", "Next time it will be the cane."]) },
        { text: "Yes, " + sir }

  function updateInteract() {
    syncSocial();
    nearNpc = null;
    if (!dialogue) {
      let best = TALK_DISTANCE;
      for (const n of npcs) {
        if (!visibleHere(n)) continue;
        const d = Math.hypot(n.x - pl.x, n.z - pl.z);
        if (d < best) { best = d; nearNpc = n; }
      }
    }
    nearDoor = false;
    nearBall = !dialogue && scene === "outside" && clock.period === "Break" && Math.hypot(ball.x - pl.x, ball.z - pl.z) < 1.7;
    nearSwing = !dialogue && scene === "outside" && !pl.onSwing && !pl.seated && Math.hypot(SWING.x - pl.x, (SWING.z + 0.65) - pl.z) < 1.8;
    if (!dialogue && scene === "outside") {
      const dDoor = Math.hypot(pl.x - DOOR_OUT.x, pl.z - DOOR_OUT.z);
      nearDoor = dDoor < 1.6 && (!nearNpc || dDoor < 1.0);   // standing right at the door, the door wins
      if (nearDoor) nearNpc = null;
    }
    dubNear = !!(dub && dub.phase === "copy" && !dub.joined && !dialogue && !lesson && !trip && scene === "class" && !pl.onSwing &&
      Math.hypot(pl.x - dubDesk(dub.owner).x, pl.z - dubDesk(dub.owner).z) < 2.6);
    const show = (nearNpc || nearDoor || dubNear) && !lesson ? "block" : "none";
    if (talkBtn.style.display !== show) talkBtn.style.display = show;
    const text = dubNear ? "Join the copying 📝" : nearNpc ? (nearNpc.kind === "vendor" ? "Buy food 🍲" : nearNpc.streetRole === "corn" ? "Buy corn 🌽" : nearNpc.streetRole === "hawker" ? "Buy water 💧" : "Talk to " + nearNpc.label)
               : nearDoor ? "Enter classroom 🚪" : "";
    if (talkBtn.textContent !== text) talkBtn.textContent = text;

    // the green button: sit down / stand up
    nearSeat = null;
    if (scene === "class" && !pl.seated && !dialogue && !lesson) {
      const f = nearestFreeSeat();
      nearSeat = f ? f.id : null;
    }
    const actShow = !dialogue && !lesson && (nearBall || nearSwing || pl.onSwing || (scene === "class" && (pl.seated || nearSeat !== null))) ? "block" : "none";
    if (actBtn.style.display !== actShow) actBtn.style.display = actShow;
    const actText = nearBall ? "Kick football ⚽" : pl.onSwing ? "Get off swing" : nearSwing ? "Use swing 🎠" : pl.seated ? "Stand up 🪑" : "Sit down 🪑";
    if (actBtn.textContent !== actText) actBtn.textContent = actText;

    // the walking pad is hidden whenever you cannot walk
    const padWanted = dialogue || lesson || pl.seated ? "none" : "grid";
    if (padEl.style.display !== padWanted) padEl.style.display = padWanted;
    const socialWanted = socialOk() ? "block" : "none";
    if (socialBtn.style.display !== socialWanted) socialBtn.style.display = socialWanted;
    updateHomeButton();
  }

  let energy = 100;

  let shownEnergy = -1;

  function addEnergy(d) {
    const before = energy;
    energy = Math.min(100, Math.max(0, energy + d));
    const real = Math.round(energy - before);
    if (real > 0) floaters.push({ text: "+" + real + " ⚡", color: "255,214,64", life: 1.6 });
  }

  function updateEnergy(dt) {
    energy = Math.max(0, energy - dt * (0.15 + (pl.moving ? 0.25 : 0)) * (perkIs("stubborn") ? 0.7 : 1));   // Stubborn: 30% slower drain
    if (pl.seated && !lesson) energy = Math.min(100, energy + dt * 1.0);   // resting at a desk
    const pct = Math.round(energy);
    if (pct !== shownEnergy) {
      shownEnergy = pct;
      energyFill.style.width = pct + "%";
      energyFill.style.background = pct > 40 ? "#4caf50" : pct > 15 ? "#f5b800" : "#e53935";
    }
  }

    { at: 52,   run: (s) => say(s.principal, "Dismissed! Go to your classes!", 4) }
  ];
  for (let k = 0; k < 6; k++) {            // six strokes, one per second
    SCRIPT.push({ at: 37 + k, run: (s) => {
      say(s.principal, "WHACK!", 0.9);
      say(s.culprit, pickOne(OUCH), 0.9);
      crowd(s, 2).forEach((n) => say(n, pickOne(REACT), 1.2));
    } });
  }
  SCRIPT.sort((a, b) => a.at - b.at);

  function startAssembly() {
    const students = npcs.filter((n) => n.kind === "student" && !n.inside);
    show = {
      t: 0, next: 0, phase: "show", murmurAt: 17, postT: 0, gossipAt: 0,
      students: students, culprit: pickOne(students.filter((n) => !n.specialCrush)),
      principal: npcs.find((n) => n.info.principal),
      kasala: npcs.find((n) => n.label === "Mr Kasala")
    };

  }

  function endShow() {
    for (const n of npcs) { n.goal = null; n.lookAt = null; n.shake = 0; n.armR = null; }
    if (show.principal.look.cane) swapCanes(show.principal, show.kasala); // cane goes back to Mr Kasala
    incident = { culprit: show.culprit };
    show.phase = "post";
    show.postT = 7;
    show.gossipAt = 0.5;
  }

  function updateDirector(dt) {
    uiTime += dt;
    const inAssembly = clock.period === "Assembly";
    if (inAssembly && !show) startAssembly();
    if (!show) return;

    if (show.phase === "show") {
      show.t += dt;
      while (show.next < SCRIPT.length && SCRIPT[show.next].at <= show.t) SCRIPT[show.next++].run(show);
      if (show.t >= show.murmurAt && show.t < 50) {
        if (show.t < 36 || show.t > 44) {   // pause the murmuring during the strokes
          const talker = show.t > 21 ? crowd(show, 1)[0] : pickOne(show.students); // after he is caught, someone else murmurs
          say(talker, pickOne(MURMURS), 2.2);
        }
        show.murmurAt = show.t + rand(1.5, 3);
      }
      const swinging = show.t >= 36.35 && show.t < 42.3;
      let flinch = false;
      if (swinging) {
        const p = (show.t - 36.35) % 1;          // where we are in one stroke: 0 to 1
        show.principal.armR = p < 0.5 ? -0.2 - 4.8 * p       // wind up: raise the arm

                            : -0.2;                            // hold at the bottom

        show.principal.armR = null;
      }
      show.culprit.armR = (show.t >= 34 && show.t < 45) ? -1.4 : null; // holding out a hand
      show.culprit.shake = flinch ? 0.06 : 0;
      if (!inAssembly) endShow();

      show.postT -= dt;
      show.gossipAt -= dt;
      if (show.gossipAt <= 0) {
        say(crowd(show, 1)[0], pickOne(POST_LINES).replace("NAME", show.culprit.label), 2.5);

      }
      if (show.postT <= 0) show = null;
    }
  }

    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
    hintEl.style.opacity = "0";
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];

      camHeight = Math.min(16, Math.max(5, camHeight + (e.clientY - p.y) * 0.03));

    p.y = e.clientY;

  // rbox works like box(): y is the height above the floor.

  function rbox(x, y, z, hx, hy, hz, c, cut) { room.push({ p: [x, 0.5 + y, z], h: [hx, hy, hz], r: 0, c: c, cut: cut }); }

  rbox(-0.6, 1.65, -4.9, 1.0, 0.02, 0.01, [235, 235, 235], [0, -1, 5]);

  function freeRoom(x, z) {

  const LECTURE = {

    "Mrs Bamidele": ["Wash your hands before cooking!", "Today: how to make stew.", "Protein builds the body."]
  };

  function seatFor(n) {
    if (n.kind === "student") {
      return { x: DESK_X[n.slot % 4], z: DESK_Z[Math.floor(n.slot / 4) % 3] + 0.75, face: Math.PI, seated: true };

  }

  // who is in the room right now: students and teachers who walked in for class
  let lateKey = "", lateLeft = 0;      // Class 2 and 4: the next teacher can be late too (seconds left)
  function syncRoom() {
    for (const n of npcs) {
      const inClass = n.inside && n.hideAt === "door" && n.mode === "class";
      const wanted = n.kind === "student" ? inClass : inClass && n.label === CLASS_TEACHER[clock.period] && lateLeft <= 0;
      if (wanted && !n.inRoom) {
        const sp = seatFor(n);
        n.x = sp.x; n.z = sp.z; n.face = sp.face; n.seated = sp.seated; n.inRoom = true;
      } else if (!wanted && n.inRoom) {
        n.inRoom = false;
        n.seated = false;
      }
    }
  }

  let roomTimer = 0;
  function updateRoom(dt) {
    if (scene !== "class") return;
    if (pl.z > 4.9 && Math.abs(pl.x) < 1) { leaveRoom(); return; }   // walked out through the door
    if (lateKey !== doneKey()) { lateKey = doneKey(); lateLeft = ((clock.period === "Class 2" || clock.period === "Class 4") && Math.random() < 0.6) ? rand(18, 30) : 0; }
    syncRoom();
    if (pl.seated && !lesson && seatTaken(pl.seatId)) { standUp(); flashHint("That seat belongs to someone else!", 3000); }
    if (pl.seated && !lesson && !done[doneKey()]) {

    }

    if (teacher && LECTURE[teacher.label] && Math.random() < 0.6) say(teacher, pickOne(LECTURE[teacher.label]), 3.5);

// ---------- 14. ATTENDING CLASS ----------
  const actBtn = document.getElementById("act");

  const QUESTION_TIME = 12;
  // "Life as..." perks live inside the saved profile (profile.perk). No perk saved = no bonus.
  const perkIs = (name) => !!profile && profile.perk === name;
  const questionTime = () => Math.max(6, QUESTION_TIME + (perkIs("brilliant") ? 4 : 0) - levelOf().timeCut);   // Brilliant: 4 extra seconds; exam week: 2 fewer
  const questionCount = () => levelOf().q;                                    // Level 1: 3, Level 2: 4, Level 3: 5
  const quizReward = () => 40 + (perkIs("brilliant") ? 10 : 0) + levelOf().pay;               // Brilliant: ₦50 per right answer
  const SUBJECT_QUIZ = { "Mr Opon": ["mathsQuiz"], "Mrs Shukudi": ["englishQuiz"], "Mrs Bamidele": ["homeEcQuiz"] };
  let lessonsTotal = 0;
  try { lessonsTotal = Number(localStorage.getItem("naijaHighLessons")) || 0; } catch (e) { lessonsTotal = 0; }

  // seats 0-7: id = row * 4 + column. Students use the same numbering through their slot.
  const AISLES = [-2.6, 0, 2.6];
  const seatId = (n) => (Math.floor(n.slot / 4) % 3) * 4 + (n.slot % 4);
  const seatPos = (id) => ({ x: DESK_X[id % 4], z: DESK_Z[Math.floor(id / 4)] + 0.75 });
  // a seat is "taken" if a student who is attending class owns it (even if still walking in)
  function seatTaken(id) { return npcs.some((n) => n.kind === "student" && n.mode === "class" && seatId(n) === id); }
  function nearestFreeSeat() {
    let best = null;
    for (let id = 0; id < 12; id++) {
      if (seatTaken(id)) continue;
      const p = seatPos(id);
      const d = Math.hypot(p.x - pl.x, p.z - pl.z);
      if (d < 1.6 && (!best || d < best.d)) best = { id: id, d: d };
    }
    return best;
  }
  function sit(id) {
    const p = seatPos(id);
    pl.x = p.x; pl.z = p.z; pl.face = Math.PI; pl.seated = true; pl.seatId = id;
    if (!npcs.some((n) => n.inRoom && n.kind === "teacher")) flashHint("You sit and rest. Your energy comes back slowly.", 3500);
  }
  function standUp() {
    const p = seatPos(pl.seatId);
    let aisle = AISLES[0];
    for (const a of AISLES) if (Math.abs(a - p.x) < Math.abs(aisle - p.x)) aisle = a;
    pl.x = aisle; pl.z = p.z; pl.seated = false; pl.yOffset = 0; pl.onSwing = false;   // step out into the nearest aisle
  }
  actBtn.addEventListener("click", () => {
    if (nearBall) {

      const dd = Math.hypot(dx, dz);
      if (dd < 0.05) { dx = Math.sin(pl.face); dz = Math.cos(pl.face); } else { dx /= dd; dz /= dd; }
      pl.face = Math.atan2(dx, dz);                              // turn to look where the ball goes

  // the question panel (re-uses the dialogue box)
  function panel(name, text, buttons) {

    document.getElementById("dtext").textContent = text;
    const box = document.getElementById("dchoices");
    box.textContent = "";
    for (const b of buttons) {
      const el = document.createElement("button");
      el.textContent = b.text;
      el.addEventListener("click", b.run);

  }
  function hidePanel() { dlg.style.display = "none"; }

  function startLesson(teacher) {
    lesson = { teacher: teacher, phase: "intro", t: 2, n: 0, correct: 0, q: null, shown: -1, seen: [] };
    done[doneKey()] = true;
    say(teacher, "Pop quiz! Books closed!", 2.5);

  function header() {
    return lesson.teacher.label + " · Question " + (lesson.n + 1) + "/" + questionCount() + " · ⏱ " + Math.max(Math.ceil(lesson.t), 0) + "s";
  }
  function makeQuestion() {
    let sc;
    for (let k = 0; k < 8; k++) {                       // try not to repeat a question

      if (!lesson.seen.includes(sc.line)) break;
    }
    lesson.seen.push(sc.line);
    return { line: sc.line, options: sc.choices.map((c) => c.text), correct: sc.choices.findIndex((c) => c.gain) };
  }
  function nearestMate() {
    let best = null, bd = 1e9;
    for (const n of npcs) {
      if (!n.inRoom || n.kind !== "student") continue;
      const d = Math.hypot(n.x - pl.x, n.z - pl.z);
      if (d < bd) { bd = d; best = n; }
    }
    return best;
  }
  function nextQuestion() {

    say(lesson.teacher, ok ? "Correct!" : i < 0 ? "Time up!" : "No. It is " + q.options[q.correct] + ".", 2);
    for (const n of shuffle(npcs.filter((m) => m.inRoom && m.kind === "student")).slice(0, 2)) {

    lesson.t = 1.6;

  }
  function finishLesson(abortMsg) {
    const c = lesson.correct;
    const bonus = !abortMsg && c === questionCount() ? 60 : 0;
    if (bonus) addMoney(bonus);
    energy = Math.max(0, energy - (perkIs("stubborn") ? 5 : 8));   // Stubborn: lessons tire you less
    lessonsTotal++;
    try { localStorage.setItem("naijaHighLessons", String(lessonsTotal)); } catch (e) { /* saving is optional */ }
    const t = lesson.teacher;
    say(t, c === questionCount() ? "Excellent! Full marks!" : c >= 2 ? "Fair. Study more." : "Hmm. See me after class.", 3);
    lesson.phase = "report";
    panel(t.label, (abortMsg ? abortMsg + " " : "Quiz over. ") + c + "/" + questionCount() + " correct." +
      (bonus ? " Full marks bonus +₦" + bonus + "!" : "") + " Lessons attended: " + lessonsTotal + ".",
      [{ text: "OK", run: () => { lesson = null; hidePanel(); } }]);
  }
  function updateLesson(dt) {
    if (!lesson || lesson.phase === "report") return;

      else finishLesson("Bell! Class is over.");
      return;
    }
    lesson.t -= dt;
    if (lesson.phase === "intro") {
      if (lesson.t <= 0) nextQuestion();
    } else if (lesson.phase === "ask") {
      const secs = Math.ceil(lesson.t);
      if (secs !== lesson.shown) { lesson.shown = secs; document.getElementById("dname").textContent = header(); }
      if (lesson.t <= 0) answer(-1);
    } else if (lesson.phase === "result" && lesson.t <= 0) {
      lesson.n++;
      if (lesson.n >= questionCount()) finishLesson(); else nextQuestion();
    }
  }

  function enterRoom() {
    scene = "class";
    pl.x = 0; pl.z = 2.3; pl.face = Math.PI;

    else if (npcs.some((n) => n.inRoom && n.kind === "student")) flashHint("The teacher is late! Watch what the students are doing... 👀", 5000);
    else flashHint("The classroom is empty right now. Walk out the door to leave.", 5000);

  }

  // ---------- 7. DRAWING ----------
  // writes a name on a fence board; the text is tilted to match the board (a flat "affine" fit of the perspective)
  function drawSign(s, project, cam) {
    if (dot(s.N, sub(cam, s.p)) <= 0) return;                  // we are behind the board
    const c = project(s.p), pa = project(add(s.p, s.A)), pu = project(add(s.p, [0, 1, 0]));
    if (c[2] < 0.1 || pa[2] < 0.1 || pu[2] < 0.1 || c[0] < -150 || c[0] > W + 150 || c[1] < -80 || c[1] > H + 80) return;
    const S = 40;                                              // text is drawn at 40 units per world block
    const ax = pa[0] - c[0], ay = pa[1] - c[1];
    if (Math.hypot(ax, ay) < 4) return;                        // too far away to read
    g.save();
    g.transform(ax / S, ay / S, -(pu[0] - c[0]) / S, -(pu[1] - c[1]) / S, c[0], c[1]);
    g.font = "700 17px sans-serif";
    const w = g.measureText(s.text).width;

  const TAG_RADIUS = 3.5; // an NPC's name shows only when you are this close...
  const TAG_FADE = 1.2;   // ...fading in over the last 1.2 blocks
  const TAG_MAX = 3;      // and never more than this many NPC names at once
  function drawNameTags(project) {
    g.font = "600 13px sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    const shown = npcs
      .filter(visibleHere)
      .map((n) => ({ ch: n, d: Math.hypot(n.x - pl.x, n.z - pl.z) }))
      .filter((e) => e.d <= TAG_RADIUS)
      .sort((a, b) => a.d - b.d)
      .slice(0, TAG_MAX);
    shown.push({ ch: pl, d: 0 });        // your own "You" tag is always there
    for (const e of shown) {
      const ch = e.ch;
      const q = project([ch.x, 2.75, ch.z]);
      if (q[2] < 0.1) continue;
      g.globalAlpha = ch === pl ? 1 : Math.min(1, (TAG_RADIUS - e.d) / TAG_FADE);
      const labelText = ch.label;
      const extra = ch.tagLabel || "";
      const w = Math.max(g.measureText(labelText).width, extra ? g.measureText(extra).width : 0) + 14;
      g.fillStyle = "rgba(0,0,0,0.65)";
      g.beginPath();
      if (g.roundRect) g.roundRect(q[0] - w / 2, q[1] - (extra ? 22 : 11), w, extra ? 38 : 22, 9);
      else g.rect(q[0] - w / 2, q[1] - (extra ? 22 : 11), w, extra ? 38 : 22);
      g.fill();
      g.fillStyle = "rgb(" + ch.tag.join(",") + ")";
      g.fillText(labelText, q[0], q[1] + (extra ? -8 : 1));
      if (extra) { g.fillStyle = "#ff9ed2"; g.font = "700 10px sans-serif"; g.fillText(extra, q[0], q[1] + 7); g.font = "600 13px sans-serif"; }
    }
    g.globalAlpha = 1;
  }

  function drawBubbles(project, dt) {
    g.font = "600 13px sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    for (const ch of [pl].concat(npcs, traffic)) {
      if (!ch.bubble) continue;
      ch.bubble.life -= dt;
      if (ch.bubble.life <= 0) { ch.bubble = null; continue; }
      if (ch !== pl && !visibleHere(ch)) continue;
      const q = project([ch.x, 3.5, ch.z]);
      if (q[2] < 0.1 || q[0] < -80 || q[0] > W + 80 || q[1] < -30 || q[1] > H + 30) continue;
      const w = g.measureText(ch.bubble.text).width + 18;
      const cx = Math.min(Math.max(q[0], w / 2 + 6), W - w / 2 - 6);
      g.globalAlpha = Math.min(1, ch.bubble.life / 0.4);
      g.fillStyle = "rgba(255,255,255,0.95)";
      g.beginPath();

  function drawFloaters(project, dt) {

  function teacherComing() {                              // is the teacher about to walk in? (the lookout shouts)

  function dubStep(n, tx, tz, dt, fx, fz) {               // walk an NPC to a spot; true when it has arrived

      const gst = pickOne(DUB_GIST), who = pickOne(d.dubbers);
      say(pl, gst.you, 2.8); if (who.inRoom) say(who, gst.reply, 3);
      if (dubFun.day !== clock.day) dubFun = { day: clock.day, n: 0 };
      let msg = "Everybody laughs quietly.";
      if (dubFun.n < 3) { dubFun.n++; popularity += 1 + (perkIs("playful") ? 1 : 0); friendship++; msg += " (+⭐ +💗)"; }
      else msg += " (The gist is getting old. No more points today.)";
      dubScreen(who.label + ": \"" + gst.reply + "\" " + msg);
      return;
    }
    d.joined = false; closeDialogue();
    if (a === "seat" || a === "run") {
      sendToSeat();
      flashHint(a === "run" ? "Phew! You reach your seat before the teacher. 😅" : "You slip back to your seat. 😇", 3500);
    } else if (a === "risk") {
      if (Math.random() < Math.min(0.9, 0.5 * levelOf().catchMul)) dubCaught();
      else {
        let msg = "Phew! You got one more line and slid into your seat in time. 😅";
        if (!d.finished) { d.progress++; if (d.progress >= COPY_GOAL) { d.finished = true; msg = dubPayout(); } }
        sendToSeat(); flashHint(msg, 5000);
      }
    }
  }

  // ---------- START MENU AND CHARACTER CHOICE ----------
  const menuEl = document.getElementById("menu"), mBox = document.getElementById("mbox");
  let menuOpen = true;
  let profile = null;                                   // { sex, crush (always the opposite sex), perk, level, start }
  try { profile = JSON.parse(localStorage.getItem("naijaHighProfile") || "null"); } catch (e) { profile = null; }
  // The crush is always the opposite sex. A broken or old save is repaired here instead of crashing the game.
  if (!profile || typeof profile !== "object" || (profile.sex !== "boy" && profile.sex !== "girl")) profile = null;
  else {
    const rightCrush = profile.sex === "boy" ? "girl" : "boy";
    if (profile.crush !== rightCrush) { profile.crush = rightCrush; crushNpc.contactExchanged = false; crushConfidence = 0; }
  }
  const BUN = [25, 20, 20];
  const CRUSH = {
    girl: { name: "Zara",  tag: [255, 225, 245], look: Object.assign(look([220, 105, 155], [45, 70, 150], SKINS[2], [230, 170, 40]), { bun: BUN }) },
    boy:  { name: "Chuka", tag: [215, 235, 255], look: look([95, 160, 225], [45, 70, 150], SKINS[1], [230, 170, 40]) }
  };
  function applyProfile() {
    const c = CRUSH[profile.crush];
    crushNpc.label = c.name; crushNpc.tag = c.tag; crushNpc.look = c.look; crushNpc.info.name = c.name;
    pl.look = look([240, 240, 240], [30, 60, 140], SKINS[0], BAGS[0]);
    if (profile.sex === "girl") pl.look.bun = BUN;
  }
  function hasProgress() {
    try { return !!profile || money > 0 || lessonsTotal > 0 || !!localStorage.getItem("naijaHighSocial"); } catch (e) { return !!profile; }
  }
  function menuScreen(title, sub, buttons) {
    mBox.textContent = "";
    const add = (id, text) => { const d = document.createElement("div"); d.id = id; d.textContent = text; mBox.appendChild(d); };
    add("mtitle", title); add("msub", sub);
    for (const b of buttons) {
      const el = document.createElement("button");
      el.textContent = b.text;
      el.addEventListener("click", b.run);
      mBox.appendChild(el);
    }
    add("mfoot", "Made by DrIntel");
  }
  // Life-as perks and starting-day presets. Both are saved INSIDE the profile (same key as before).
  const PERKS = {
    brilliant: { name: "🧠 Brilliant", note: "Quizzes: +4 seconds, ₦50 per right answer" },
    playful:   { name: "🎈 Playful",   note: "Truth or Dare: +1 extra popularity" },
    stubborn:  { name: "💪 Stubborn",  note: "Energy drains 30% slower, lessons tire you less" },
    charming:  { name: "😎 Charming",  note: "Crush talks: +1 extra confidence" }
  };
  const STARTS = {
    early:    { name: "🌅 Early bird",     note: "7:30 AM, Arrival, full energy",       min: 450, energy: 100 },
    assembly: { name: "🔔 Assembly rush",  note: "8:00 AM, catch the assembly, energy 90", min: 480, energy: 90 },
    class1:   { name: "📚 Late to class",  note: "9:00 AM, Class 1 begins, energy 75",   min: 540, energy: 75 },
    brk:      { name: "🍲 Break time",     note: "11:00 AM, Break, energy 65",           min: 660, energy: 65 }
  };
  const LEVELS = {
    1: { id: 1, short: "Level 1", name: "🌱 Level 1 · First day at school", note: "Day 1. You are new here. Quizzes: 3 questions. Teachers go easy on copying.", day: 1, q: 3, timeCut: 0, pay: 0, catchMul: 0.5 },
    2: { id: 2, short: "Level 2", name: "📅 Level 2 · Second week in school", note: "Day 8. Normal school life. Quizzes: 4 questions.", day: 8, q: 4, timeCut: 0, pay: 0, catchMul: 1 },
    3: { id: 3, short: "Level 3", name: "📝 Level 3 · Exam week", note: "Day 15. Quizzes: 5 questions, 2 seconds less, but +₦10 per right answer. Teachers watch closely.", day: 15, q: 5, timeCut: 2, pay: 10, catchMul: 1.5 }
  };
  function levelOf() { return (profile && LEVELS[profile.level]) || LEVELS[1]; }   // old saves have no level: they get Level 1
  let applied = "";                                       // which level|start was applied last, so Continue can never refill energy
  function startGame() {
    applyProfile();
    const st = STARTS[profile.start] || STARTS.early, lv = levelOf();
    const sig = lv.id + "|" + (STARTS[profile.start] ? profile.start : "early");
    if (applied !== sig) {                                // a new level or a new start: set the clock (the very first time, also the energy)
      const first = applied === "";
      applied = sig;
      if (!first) resetScenes();
      clock.min = st.min; clock.day = lv.day; clock.period = ""; // empty period makes the bell and the NPCs react to the new time
      energy = first ? st.energy : Math.min(energy, st.energy);  // changing the menu mid-game can lower energy, never raise it
    }
    menuEl.style.display = "none"; menuOpen = false;
    const pk = PERKS[profile.perk];
    flashHint((pk ? "Life as " + pk.name + " · " : "") + lv.short + " · " + st.name, 6000);
  }
  function chooseSex() {
    menuScreen("Who are you?", "Pick your character.", [
      { text: "👦 I am a boy", run: () => choosePerk("boy") },
      { text: "👧 I am a girl", run: () => choosePerk("girl") }
    ]);
  }
  function choosePerk(sex) {
    const buttons = Object.keys(PERKS).map((k) => ({ text: PERKS[k].name + "\n" + PERKS[k].note, run: () => chooseLevel(sex, k) }));
    buttons.push({ text: "← Back", run: chooseSex });
    menuScreen("Life as...", "Pick one perk. It stays with you.", buttons);
  }
  function chooseLevel(sex, perk) {
    const buttons = Object.keys(LEVELS).map((k) => ({ text: LEVELS[k].name + "\n" + LEVELS[k].note, run: () => chooseStart(sex, perk, Number(k)) }));
    buttons.push({ text: "← Back", run: () => choosePerk(sex) });
    menuScreen("Choose your level", "Money and points are never reset by this.", buttons);
  }
  function chooseStart(sex, perk, level) {
    const buttons = Object.keys(STARTS).map((k) => ({ text: STARTS[k].name + "\n" + STARTS[k].note, run: () => finishChoice(sex, perk, level, k) }));
    buttons.push({ text: "← Back", run: () => chooseLevel(sex, perk) });
    menuScreen("How does your day start?", "Money and points are never reset by this.", buttons);
  }
  function finishChoice(sex, perk, level, start) {
    const crush = sex === "boy" ? "girl" : "boy";         // the crush follows from who you are
    const before = profile ? profile.crush : "girl";
    if (before !== crush) { crushNpc.contactExchanged = false; crushConfidence = 0; crushToday = { day: -1 }; }   // new crush, fresh start
    profile = { sex: sex, crush: crush, perk: perk, level: level, start: start };
    try { localStorage.setItem("naijaHighProfile", JSON.stringify(profile)); } catch (e) { /* saving is optional */ }
    startGame();
  }
  function openMenu() {
    if (!hasProgress()) { chooseSex(); return; }
    const pk = profile && PERKS[profile.perk], st = profile && STARTS[profile.start];
    const who = (pk ? pk.name : "No perk yet") + " · " + levelOf().short + " · " + (st ? st.name : STARTS.early.name);
    menuScreen("Naija High", "Welcome back! Your money and points are saved. " + who, [
      { text: "▶ Continue", run: () => { if (!profile) profile = { sex: "boy", crush: "girl" }; startGame(); } },
      { text: "🎭 Choose who I am", run: chooseSex }
    ]);
  }
  openMenu();
  // the 🔄 button: pause the game and go back to the menu (change perk, character or crush)
  document.getElementById("menuBtn").addEventListener("click", () => {
    if (menuOpen || dead) return;
    keys.up = keys.down = keys.left = keys.right = false;
    menuOpen = true; menuEl.style.display = "flex";
    openMenu();
  });

  function drawBall(project, focal) {
    const bp = project([ball.x, 0.62, ball.z]);
    const shadow = project([ball.x, 0.51, ball.z]);
    if (bp[2] > 0.1 && bp[0] > -30 && bp[0] < W + 30 && bp[1] > -30 && bp[1] < H + 30) {
      g.fillStyle = "rgba(0,0,0,0.25)"; g.beginPath(); g.ellipse(shadow[0], shadow[1], 10, 5, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#f7f7f7"; g.beginPath(); g.arc(bp[0], bp[1], Math.max(5, Math.min(15, focal / bp[2] * 0.16)), 0, Math.PI * 2); g.fill();
      g.strokeStyle = "#202020"; g.lineWidth = 2; g.stroke();
      g.fillStyle = "#202020"; g.beginPath(); g.arc(bp[0], bp[1], Math.max(2, Math.min(5, focal / bp[2] * 0.055)), 0, Math.PI * 2); g.fill();
    }
    g.strokeStyle = "rgba(0,0,0,0.2)"; g.lineWidth = 1;          // put the pen back for the blocks
  }

  let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = (menuOpen || dead) ? 0 : Math.min((now - last) / 1000, 0.05); // seconds since last frame, capped (0 while the menu is open)
    last = now;
    updatePlayer(dt);
    for (const n of npcs) updateNpc(n, dt);
    if (scene === "outside") {
      const bx = ball.x + ball.vx * dt, bz = ball.z + ball.vz * dt;
      if (free(bx, ball.z)) ball.x = bx; else ball.vx *= -0.55;   // bounce off trees, fence, stall
      if (free(ball.x, bz)) ball.z = bz; else ball.vz *= -0.55;
      const drag = Math.pow(0.10, dt); ball.vx *= drag; ball.vz *= drag;
      if (Math.abs(ball.vx) + Math.abs(ball.vz) < 0.08) ball.vx = ball.vz = 0;
      if (ball.x < -15 || ball.x > 15) { ball.x = Math.max(-15, Math.min(15, ball.x)); ball.vx *= -0.55; }
      if (ball.z < -11 || ball.z > 29) { ball.z = Math.max(-11, Math.min(29, ball.z)); ball.vz *= -0.55; }
    }
    updateTraffic(dt);
    updateRoadWarning();
    updateClock(dt);
    updateInteract();
    updateEnergy(dt);
    updateDirector(dt);
    // One pendulum angle drives the chains, seat and player together.
    // The seat follows a proper arc from the fixed top pivot instead of sliding sideways.
    SWING.angle = pl.onSwing ? Math.sin(uiTime * 2.35) * 0.48 : Math.sin(uiTime * 0.8) * 0.018;
    const seatY = SWING_PIVOT_Y - Math.cos(SWING.angle) * SWING_LENGTH;
    const seatZ = SWING.z + Math.sin(SWING.angle) * SWING_LENGTH;
    swingSeat.rx = SWING.angle;
    swingSeat.p[0] = SWING.x;
    swingSeat.p[1] = seatY;
    swingSeat.p[2] = seatZ;
    for (let i = 0; i < swingChains.length; i++) {
      const dx = i === 0 ? -0.32 : 0.32;
      swingChains[i].rx = SWING.angle;
      swingChains[i].p[0] = SWING.x + dx;
      swingChains[i].p[1] = (SWING_PIVOT_Y + seatY) / 2;
      swingChains[i].p[2] = (SWING.z + seatZ) / 2;
    }
    if (pl.onSwing) {
      // Keep the seated character attached to the seat's exact arc and height.
      pl.x = SWING.x;
      pl.z = seatZ;
      pl.yOffset = seatY - 0.5;
      pl.face = Math.PI;
      pl.seated = true;
    }
    updateRoom(dt);
    updateLesson(dt);
    updateDub(dt);
    updateHome(dt);

    const list = [];
    addCharacter(list, pl);
    for (const n of npcs) if (visibleHere(n)) addCharacter(list, n);
    if (scene === "outside") for (const v of traffic) if (Math.abs(v.x - pl.x) < 24) addVehicle(list, v);

    const target = [pl.x, 1, pl.z];
    const cam = [pl.x + Math.sin(camYaw) * 11, camHeight, pl.z + Math.cos(camYaw) * 11];
    // the world we are in; classroom walls between the camera and the room are left out
    const world = scene === "outside" ? solids : room.filter((b) => !b.cut || b.cut[0] * cam[0] + b.cut[1] * cam[2] <= b.cut[2]);
    for (const b of world) list.push(b);
    const f = norm(sub(target, cam));
    const r = norm(cross(f, [0, 1, 0]));
    const u = cross(r, f);
    const focal = Math.min(W, H) * 1.1 * camZoom;
    const project = (p) => {
      const d = sub(p, cam);
      const z = dot(d, f);
      return [W / 2 + focal * dot(d, r) / z, H / 2 - focal * dot(d, u) / z, z];
    };

    g.fillStyle = scene === "outside" ? "#87ceeb" : "#2a2d3a";
    g.fillRect(0, 0, W, H);
    g.strokeStyle = "rgba(0,0,0,0.2)";

    // ground first: flat tiles never cover anything standing on them
    for (const tl of (scene === "outside" ? tiles : roomTiles)) {
      const pts = [[tl.i, 0.5, tl.j], [tl.i + 1, 0.5, tl.j], [tl.i + 1, 0.5, tl.j + 1], [tl.i, 0.5, tl.j + 1]].map(project);
      if (pts.some((q) => q[2] < 0.1)) continue;
      drawQuad(pts, "rgb(" + tl.c.join(",") + ")");
    }

    // then everything else, far to near
    const dist = (b) => Math.hypot(b.p[0] - cam[0], b.p[1] - cam[1], b.p[2] - cam[2]);
    if (scene === "outside") for (const s of SIGNS) list.push(s);
    if (scene === "outside") list.push({ ball: true, p: [ball.x, 0.62, ball.z], h: [0, 0, 0], c: [0, 0, 0] });
    list.sort((a, b) => dist(b) - dist(a));
    for (const b of list) {
      if (b.sign) { drawSign(b, project, cam); continue; }
      if (b.ball) { drawBall(project, focal); continue; }
      for (const face of FACES) {
        const n = orient(face.n, b);
        const local = [face.n[0] * b.h[0], face.n[1] * b.h[1], face.n[2] * b.h[2]];
        const center = add(b.p, orient(local, b));
        if (dot(n, sub(cam, center)) <= 0) continue;
        const pts = face.v.map((k) =>
          project(add(b.p, orient([k[0] * b.h[0], k[1] * b.h[1], k[2] * b.h[2]], b)))
        );
        if (pts.some((q) => q[2] < 0.1)) continue;
        drawQuad(pts, "rgb(" + b.c.map((v) => Math.round(v * face.s)).join(",") + ")");
      }
    }

    drawNameTags(project);
    drawBubbles(project, dt);
    drawFloaters(project, dt);
  }
  requestAnimationFrame(frame);
} catch (e) {
  document.getElementById("footer").textContent = "Error: " + e.message;
}
</script>
</body>
</html>
